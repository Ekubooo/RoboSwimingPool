[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roboswimmingpool-rsp"
version = "0.1.0"
description = "RSP, Newton solvers and PCA tools for the integrated source checkout"
readme = "Robot_Lab/RSP/README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
include-package-data = false
py-modules = []

[tool.setuptools.packages.find]
where = ["Robot_Lab"]
include = ["RSP", "RSP.*", "Solver", "Solver.*", "PCA", "PCA.*"]
namespaces = false

[tool.setuptools.dynamic]
dependencies = {file = ["Robot_Lab/RSP/sim_ready/requirements.txt"]}
